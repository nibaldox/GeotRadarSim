name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Default to read-only permissions; deployment grants Pages access at job scope.
permissions:
  contents: read

# Keep PR verification isolated from Pages deployment runs; do not cancel in-progress runs.
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Read pinned versions
        id: versions
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          toolchain = tomllib.load(open('rust/rust-toolchain.toml', 'rb'))['toolchain']['channel']
          bindgen = next(p['version'] for p in tomllib.load(open('rust/Cargo.lock', 'rb'))['package'] if p['name'] == 'wasm-bindgen')
          for name, value in [('toolchain', toolchain), ('bindgen', bindgen)]:
              if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', value):
                  raise ValueError(f'Invalid {name} version: {value!r}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'toolchain={toolchain}\nbindgen={bindgen}\n')
          PY
      - name: Install pinned Rust
        env:
          RUST_TOOLCHAIN: ${{ steps.versions.outputs.toolchain }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - name: Cache wasm-bindgen
        id: bindgen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wasm-bindgen/bin
          key: wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.toolchain }}-${{ steps.versions.outputs.bindgen }}
      - name: Install wasm-bindgen
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        env:
          RUST_TOOLCHAIN: ${{ steps.versions.outputs.toolchain }}
          WASM_BINDGEN_VERSION: ${{ steps.versions.outputs.bindgen }}
        run: cargo +"$RUST_TOOLCHAIN" install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --root "$RUNNER_TEMP/wasm-bindgen"
      - name: Add wasm-bindgen to PATH
        run: echo "$RUNNER_TEMP/wasm-bindgen/bin" >> "$GITHUB_PATH"
      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: rust
      - name: Lint Rust
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: rust
      - name: Test Rust
        run: cargo test --locked
        working-directory: rust
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Run tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Read pinned versions
        id: versions
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          toolchain = tomllib.load(open('rust/rust-toolchain.toml', 'rb'))['toolchain']['channel']
          bindgen = next(p['version'] for p in tomllib.load(open('rust/Cargo.lock', 'rb'))['package'] if p['name'] == 'wasm-bindgen')
          for name, value in [('toolchain', toolchain), ('bindgen', bindgen)]:
              if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', value):
                  raise ValueError(f'Invalid {name} version: {value!r}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'toolchain={toolchain}\nbindgen={bindgen}\n')
          PY
      - name: Install pinned Rust
        env:
          RUST_TOOLCHAIN: ${{ steps.versions.outputs.toolchain }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - name: Cache wasm-bindgen
        id: bindgen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wasm-bindgen/bin
          key: wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.toolchain }}-${{ steps.versions.outputs.bindgen }}
      - name: Install wasm-bindgen
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        env:
          RUST_TOOLCHAIN: ${{ steps.versions.outputs.toolchain }}
          WASM_BINDGEN_VERSION: ${{ steps.versions.outputs.bindgen }}
        run: cargo +"$RUST_TOOLCHAIN" install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --root "$RUNNER_TEMP/wasm-bindgen"
      - name: Add wasm-bindgen to PATH
        run: echo "$RUNNER_TEMP/wasm-bindgen/bin" >> "$GITHUB_PATH"
      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: rust
      - name: Lint Rust
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: rust
      - name: Test Rust
        run: cargo test --locked
        working-directory: rust
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Run tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './frontend/dist'

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
